<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Not Found — CarePoint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .error-box {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .error-icon { font-size: 3rem; color: #f87171; margin-bottom: 16px; }
        .error-title { font-size: 1.3rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
        .error-text { font-size: 0.9rem; color: #64748b; margin-bottom: 24px; line-height: 1.6; }
        .back-link {
            display: inline-block;
            padding: 10px 24px;
            background: #6366f1;
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-icon"><i class="fas fa-qrcode"></i></div>
        <div class="error-title">Visit Not Found</div>
        <div class="error-text">
            This QR code is invalid or the visit record does not exist.
            Please check the QR code and try again.
        </div>
        <a class="back-link" href="/"><i class="fas fa-home" style="margin-right:6px;"></i>Go Home</a>
    </div>
</body>
</html>
