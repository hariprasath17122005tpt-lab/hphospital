<!-- Nurse Sidebar -->
<aside class="app-sidebar" id="appSidebar">
    <!-- Brand -->
    <a href="{{ url_for('nurse.dashboard') }}" class="sidebar-brand">
        <div class="sidebar-brand-icon" style="background: linear-gradient(135deg, #34d399, #059669);">
            <i class="fas fa-user-nurse"></i>
        </div>
        <div class="sidebar-brand-text">Care<span>Point</span></div>
    </a>

    <!-- Navigation -->
    <nav class="sidebar-nav">
        <span class="sidebar-section-label">Nurse Portal</span>

        <a href="{{ url_for('nurse.dashboard') }}"
            class="sidebar-link {% if request.endpoint == 'nurse.dashboard' %}active{% endif %}">
            <i class="fas fa-th-large"></i>
            Dashboard
        </a>
    </nav>

    <!-- User Card -->
    <div class="sidebar-user">
        <div class="sidebar-avatar" style="background: linear-gradient(135deg, #34d399, #059669);">
            {{ current_user.username[0]|upper }}
        </div>
        <div class="sidebar-user-info">
            <div class="sidebar-user-name">{{ current_user.username }}</div>
            <div class="sidebar-user-role">Nurse</div>
        </div>
    </div>

    <!-- Logout -->
    <div class="sidebar-footer">
        <a href="{{ url_for('auth.logout') }}" class="sidebar-link">
            <i class="fas fa-sign-out-alt"></i>
            Logout
        </a>
    </div>
</aside>
