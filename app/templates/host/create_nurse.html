{% extends "base.html" %}
{% block title %}Create Nurse Account - Host{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-lg">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="fw-bold mb-0"><i class="fas fa-user-nurse me-2"></i> Create Nurse Account</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name <span class="text-danger">*</span></label>
                                <input type="text" name="first_name" class="form-control" required
                                    placeholder="e.g. Sarah">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name <span class="text-danger">*</span></label>
                                <input type="text" name="last_name" class="form-control" required
                                    placeholder="e.g. Johnson">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Username <span class="text-danger">*</span></label>
                            <input type="text" name="username" class="form-control" required
                                placeholder="e.g. nurse_sarah">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password <span class="text-danger">*</span></label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Registration Number <span class="text-danger">*</span></label>
                            <input type="text" name="registration_number" class="form-control" required
                                placeholder="e.g. NL-2024-001">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Specialization</label>
                            <select name="specialization" class="form-select">
                                <option value="General" selected>General</option>
                                <option value="Surgical">Surgical</option>
                                <option value="ICU">ICU</option>
                                <option value="Pediatric">Pediatric</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Emergency">Emergency</option>
                                <option value="Maternity">Maternity</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" name="phone" class="form-control"
                                placeholder="e.g. +1-234-567-8900">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-user-check me-2"></i> Create Nurse Account
                            </button>
                            <a href="{{ url_for('host.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
