{% extends "base.html" %}

{% block title %}Scanner Access - Host Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <div class="icon-box bg-danger text-white rounded-circle shadow-lg mx-auto mb-3 d-flex align-items-center justify-content-center"
                    style="width: 80px; height: 80px; font-size: 2rem;">
                    <i class="fas fa-biohazard"></i>
                </div>
                <h2 class="fw-bold text-dark">Host Access</h2>
                <p class="text-muted">Restricted Area. Authorized Personnel Only.</p>
            </div>

            <div class="card border-0 shadow-lg" style="border-top: 5px solid #dc3545;">
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-4">
                            <label class="form-label fw-bold text-uppercase small text-secondary">
                                <i class="fas fa-id-badge me-2"></i>Operator ID (Username)
                            </label>
                            <input type="text" name="username" class="form-control form-control-lg bg-light border-0"
                                required placeholder="Enter ID..." autofocus>
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-bold text-uppercase small text-secondary">
                                <i class="fas fa-key me-2"></i>Access Code (Password)
                            </label>
                            <input type="password" name="password"
                                class="form-control form-control-lg bg-light border-0" required placeholder="••••••••">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-danger btn-lg text-uppercase fw-bold shadow-sm">
                                <i class="fas fa-fingerprint me-2"></i> Authenticate
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-light py-3 border-0 text-center">
                    <small class="text-muted">
                        <i class="fas fa-video me-1"></i> System activity is monitored and logged.
                    </small>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="{{ url_for('main.index') }}" class="text-decoration-none text-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Return to Public Gateway
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
