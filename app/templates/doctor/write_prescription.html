{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-prescription-bottle"></i> Write Prescription</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                        <div class="mb-3">
                            <label for="patient_name" class="form-label">Patient</label>
                            <input type="text" class="form-control" id="patient_name"
                                value="{{ patient.first_name }} {{ patient.last_name }}" disabled>
                            <input type="hidden" name="patient_id" value="{{ patient.id }}">
                        </div>

                        <div class="mb-3">
                            <label for="medicines" class="form-label">Medication Name *</label>
                            <input type="text" class="form-control" id="medicines" name="medicines"
                                placeholder="e.g., Aspirin" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="dosage" class="form-label">Dosage *</label>
                                    <input type="text" class="form-control" id="dosage" name="dosage"
                                        placeholder="e.g., 500mg" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="frequency" class="form-label">Frequency *</label>
                                    <select class="form-control" id="frequency" name="frequency" required>
                                        <option value="">Select frequency</option>
                                        <option value="Once daily">Once daily</option>
                                        <option value="Twice daily">Twice daily</option>
                                        <option value="Three times daily">Three times daily</option>
                                        <option value="Every 4 hours">Every 4 hours</option>
                                        <option value="Every 6 hours">Every 6 hours</option>
                                        <option value="Every 8 hours">Every 8 hours</option>
                                        <option value="As needed">As needed</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="duration" class="form-label">Duration *</label>
                            <input type="text" class="form-control" id="duration" name="duration"
                                placeholder="e.g., 7 days, 2 weeks" required>
                        </div>

                        <div class="mb-3">
                            <label for="instructions" class="form-label">Instructions / Notes</label>
                            <textarea class="form-control" id="instructions" name="instructions" rows="4"
                                placeholder="Any special instructions for the patient..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="diet_recommendations" class="form-label">Diet Recommendations</label>
                                    <textarea class="form-control" id="diet_recommendations" name="diet_recommendations"
                                        rows="2" placeholder="Dietary restrictions..."></textarea>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="exercise_recommendations" class="form-label">Exercise
                                        Recommendations</label>
                                    <textarea class="form-control" id="exercise_recommendations"
                                        name="exercise_recommendations" rows="2"
                                        placeholder="Exercise plan..."></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('doctor.patient_list') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-check"></i> Issue Prescription
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
