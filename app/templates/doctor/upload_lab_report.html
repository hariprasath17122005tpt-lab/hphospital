{% extends "base.html" %}

{% block title %}Upload Lab Report{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="fas fa-file-medical-alt me-2"></i> Upload Lab Result</h4>
                </div>
                <div class="card-body p-4">
                    <div class="d-flex align-items-center mb-4">
                        <div class="avatar bg-light text-primary rounded-circle d-flex align-items-center justify-content-center me-3"
                            style="width: 50px; height: 50px;">
                            <i class="fas fa-user fa-lg"></i>
                        </div>
                        <div>
                            <h5 class="mb-0">{{ patient.first_name }} {{ patient.last_name }}</h5>
                            <small class="text-muted">Patient ID: #{{ "%04d"|format(patient.id) }}</small>
                        </div>
                    </div>

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Test Name <span class="text-danger">*</span></label>
                                <input type="text" name="test_name" class="form-control" required
                                    placeholder="e.g. Complete Blood Count (CBC)">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Result Value</label>
                                <input type="text" name="result_value" class="form-control" placeholder="e.g. 14.5">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Unit</label>
                                <input type="text" name="unit" class="form-control" placeholder="e.g. g/dL">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Reference Range</label>
                                <input type="text" name="reference_range" class="form-control"
                                    placeholder="e.g. 12.0 - 16.0">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-select">
                                    <option value="Completed">Completed</option>
                                    <option value="Pending">Pending</option>
                                    <option value="Preliminary">Preliminary</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Clinical Notes</label>
                                <textarea name="notes" class="form-control" rows="3"
                                    placeholder="Additional observations or interpretation..."></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('doctor.view_patient', patient_id=patient.id) }}"
                                class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning px-4">
                                <i class="fas fa-upload me-2"></i> Save Report
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
