{% extends "base.html" %}

{% block title %}Patient Registration - HealthCare AI{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row min-vh-100 align-items-center justify-content-center">
        <div class="col-lg-8">
            <div class="modern-card p-5">
                <div class="text-center mb-5">
                    <div class="d-inline-flex align-items-center justify-content-center bg-soft-primary rounded-circle mb-3"
                        style="width: 60px; height: 60px;">
                        <i class="fas fa-user-plus text-primary fs-3"></i>
                    </div>
                    <h2 class="fw-bold text-gradient">Create Patient Account</h2>
                    <p class="text-secondary">Join thousands getting AI-powered healthcare</p>
                </div>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label for="username"
                                class="form-label text-secondary small text-uppercase fw-bold ls-1">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="Choose a username" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email"
                                class="form-label text-secondary small text-uppercase fw-bold ls-1">Email</label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="your@email.com" required>
                        </div>
                    </div>

                    <div class="row g-4 mt-1">
                        <div class="col-md-6">
                            <label for="password"
                                class="form-label text-secondary small text-uppercase fw-bold ls-1">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Strong password" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password"
                                class="form-label text-secondary small text-uppercase fw-bold ls-1">Confirm
                                Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                placeholder="Confirm password" required>
                        </div>
                    </div>

                    <div class="row g-4 mt-1">
                        <div class="col-md-6">
                            <label for="first_name"
                                class="form-label text-secondary small text-uppercase fw-bold ls-1">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" placeholder="John"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label for="last_name"
                                class="form-label text-secondary small text-uppercase fw-bold ls-1">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Doe"
                                required>
                        </div>
                    </div>

                    <div class="row g-4 mt-1">
                        <div class="col-md-6">
                            <label for="age"
                                class="form-label text-secondary small text-uppercase fw-bold ls-1">Age</label>
                            <input type="number" class="form-control" id="age" name="age" min="1" max="120"
                                placeholder="25" required>
                        </div>
                        <div class="col-md-6">
                            <label for="gender"
                                class="form-label text-secondary small text-uppercase fw-bold ls-1">Gender</label>
                            <select class="form-control webkit-appearance-none" id="gender" name="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label for="phone" class="form-label text-secondary small text-uppercase fw-bold ls-1">Phone
                            Number</label>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="+1 (555) 123-4567">
                    </div>

                    <div class="mt-5">
                        <button type="submit" class="btn btn-primary w-100 btn-lg shadow-lg">
                            Create Account <i class="fas fa-check ms-2"></i>
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-light">
                    <p class="mb-2">Already have an account? <a href="{{ url_for('auth.patient_login') }}"
                            class="fw-bold text-primary">Login here</a></p>
                    <a href="{{ url_for('main.index') }}" class="text-muted small">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
