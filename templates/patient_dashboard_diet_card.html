<!-- Smart Diet Plan Dashboard Card Component -->
<!-- Professional card for patient dashboard showing personalized diet plan feature -->

<div class="diet-plan-card-container">
  <style>
    .diet-plan-card-container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      animation: slideInUp 0.6s ease-out;
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .diet-plan-card {
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #d1fae5;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .diet-plan-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        135deg,
        transparent 0%,
        rgba(16, 185, 129, 0.03) 50%,
        transparent 100%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .diet-plan-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 32px rgba(16, 185, 129, 0.15);
      border-color: #6ee7b7;
    }

    .diet-plan-card:hover::before {
      opacity: 1;
    }

    .diet-icon-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .diet-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
      animation: pulseIcon 3s ease-in-out infinite;
    }

    @keyframes pulseIcon {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 12px 24px rgba(16, 185, 129, 0.4);
      }
    }

    .diet-card-title {
      font-size: 24px;
      font-weight: 700;
      color: #047857;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      letter-spacing: -0.5px;
    }

    .diet-card-description {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.6;
      position: relative;
      z-index: 1;
      font-family: 'Segoe UI', 'Arial', sans-serif;
    }

    .diet-plan-features {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
      flex-wrap: wrap;
      justify-content: center;
    }

    .feature-badge {
      background: white;
      border: 1px solid #d1fae5;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #059669;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .feature-badge:hover {
      background: #ecfdf5;
      border-color: #6ee7b7;
    }

    .feature-badge::before {
      content: '✓';
      font-weight: bold;
    }

    .diet-cta-button {
      display: inline-block;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      font-family: 'Segoe UI', 'Arial', sans-serif;
      letter-spacing: 0.3px;
    }

    .diet-cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
    }

    .diet-cta-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }

    .diet-plan-status {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #d1fae5;
      position: relative;
      z-index: 1;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #6b7280;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: statusPulse 2s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .diet-plan-card {
        padding: 24px 16px;
      }

      .diet-icon {
        width: 70px;
        height: 70px;
        font-size: 34px;
      }

      .diet-card-title {
        font-size: 20px;
      }

      .diet-card-description {
        font-size: 13px;
      }

      .diet-plan-features {
        gap: 8px;
      }

      .feature-badge {
        padding: 5px 10px;
        font-size: 11px;
      }
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      .diet-plan-card {
        background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
        border-color: #047857;
      }

      .diet-card-title {
        color: #a7f3d0;
      }

      .diet-card-description {
        color: #d1d5db;
      }

      .feature-badge {
        background: #1f2937;
        border-color: #10b981;
        color: #6ee7b7;
      }

      .feature-badge:hover {
        background: #111827;
      }
    }
  </style>

  <!-- Card Component -->
  <div class="diet-plan-card">
    <!-- Icon -->
    <div class="diet-icon-wrapper">
      <div class="diet-icon">🥗</div>
    </div>

    <!-- Title -->
    <h3 class="diet-card-title">Smart Diet Plan</h3>

    <!-- Description -->
    <p class="diet-card-description">
      Access your personalized nutrition plan generated by our clinical AI system.
    </p>

    <!-- Feature Badges -->
    <div class="diet-plan-features">
      <span class="feature-badge">AI Generated</span>
      <span class="feature-badge">Personalized</span>
      <span class="feature-badge">Clinical</span>
    </div>

    <!-- Call-to-Action Button -->
    <a href="{{ url_for('diet_plan.view_diet_plan_professional', patient_id=current_user.patient.id) }}" 
       class="diet-cta-button">
      View Your Plan
    </a>

    <!-- Status Indicator -->
    <div class="diet-plan-status">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>Plan Available Now</span>
      </div>
    </div>
  </div>
</div>
